<html lang="en">
<head>
{% include head.html %}
</head>
<body>
{% include header.html %}
<main id="main" class="page">
  <div class="wrap {% unless page.wide %}prose{% endunless %}">

  </div>
</main>
{% include footer.html %}
</body>
</html>
