# Going live on Atlassian: change `status: pending` to `status: live` for that app.
- slug: text-gadget
  security_page: true
  name: Text & Announcement Gadget
  suffix: for Jira
  platform: Jira Cloud
  icon: /assets/img/icons/text-gadget.svg
  benefit: Put Markdown text and announcement banners on Jira dashboards.
  lead: Markdown text and announcement banners on Jira Cloud dashboards. It runs on Atlassian (Forge), asks for no permissions and sends no data outside your Jira site.
  status: pending
  install_url: https://marketplace.atlassian.com/apps/302054937
  install_label: Install from Atlassian Marketplace
  pending_label: Coming soon on Atlassian Marketplace
  price: Free for up to 10 users. Above that, $0.30 per user / month, billed by Atlassian.
  docs_url: /text-gadget/docs
  chips: [Markdown text, Announcement banners, Scheduled announcements, Dark mode]
  benefits:
    - {title: Write it in Markdown, text: "Add formatted text, links and tables to any dashboard from the gadget's Configure screen."}
    - {title: Announce on a schedule, text: "Show an announcement banner on a dashboard and schedule when it appears."}
    - {title: Nothing leaves your site, text: "No permissions requested and no data sent outside your Jira site."}
  shots:
    - {file: text-gadget-1, alt: "A release freeze announcement on a Jira dashboard"}
    - {file: text-gadget-2, alt: "Editing a gadget with a live preview"}
